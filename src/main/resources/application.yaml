spring:

  application:
    name: touchstone-compiler

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  compile-job-poller:
    enabled: true
  compile-endpoint:
    enabled: true # debug/coverage tool; turn off outside dev
  aws:
    region: us-east-1
    endpoint: http://localhost:4566
    access-key: test
    secret-key: test
    raw-content-bucket: touchstone-raw-content
    compiled-template-bucket: touchstone-compiled-templates
    compile-queue-url: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/touchstone-compile-jobs
